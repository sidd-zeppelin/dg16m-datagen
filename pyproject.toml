[project]
name = "dg16m-datagen"
version = "0.1.0"
description = "DG16M Dataset Generation Pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "autolab-core>=1.1.1",
    "cvxopt>=1.3.3",
    "cvxpy>=1.9.2",
    "h5py>=3.16.0",
    "ipython>=9.15.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pillow>=12.3.0",
    "python-fcl>=0.7.0.11",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "tqdm>=4.68.4",
    "trimesh>=4.12.2",
    "wandb>=0.28.0",
    "meshpy",
    "ipykernel>=7.3.0",
    "pyglet<2",
    "pyopengl>=3.1.10",
    "jinja2>=3.1.6",
]

[tool.uv.sources]
meshpy = { path = "core/meshpy", editable = true }
